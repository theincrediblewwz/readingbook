name: Diagnose native graph save

on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        default: graph-save
        options: [graph-save, component-presentation, graph-document-previews]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build unoptimized product with test access
        run: swift build --scratch-path .build/tests -Xswiftc -enable-testing
      - name: Observe original graph checks
        if: inputs.scenario == 'graph-save'
        run: python3 scripts/native-ui-regression/run-graph-label-reuse.py --bin-dir .build/tests/debug --tag ci-graph-save-diagnostic
      - name: Observe repeated component presentation checks
        if: inputs.scenario == 'component-presentation'
        shell: bash
        run: |
          result=0
          for attempt in 1 2 3 4 5 6; do
            python3 scripts/native-ui-regression/run-dynamic-components.py --bin-dir .build/tests/debug --tag ci-presentation-diagnostic-$attempt || result=1
          done
          exit "$result"
      - name: Observe native graph preview pixels and actions
        if: inputs.scenario == 'graph-document-previews'
        shell: bash
        run: |
          result=0
          python3 scripts/native-ui-regression/run-graph-document-previews.py --bin-dir .build/tests/debug --tag ci-graph-preview-raster --raster-observation || result=1
          python3 scripts/native-ui-regression/run-graph-document-previews.py --bin-dir .build/tests/debug --tag ci-graph-preview-native || result=1
          exit "$result"
      - name: Preserve native state and original result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-presentation-diagnostic-evidence
          path: |
            logs/map-allocation-20261104/ci-graph-save-diagnostic
            logs/dynamic-components-20261104/ci-presentation-diagnostic-*
            logs/graph-content-20261107/ci-graph-preview-*
          if-no-files-found: error
          retention-days: 3
