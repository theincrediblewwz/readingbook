name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel
      pdf_probe:
        description: Run only the temporary synthetic PDFKit hit probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core data and plugin checks
        if: ${{ !inputs.pdf_probe }}
        run: swift test --scratch-path .build/tests
      - name: Synthetic PDFKit hit probe
        if: ${{ inputs.pdf_probe }}
        timeout-minutes: 3
        run: |
          xcrun swiftc -parse-as-library Sources/ReadingCore/ReadingGeometryBands.swift Sources/ReadingCore/NativePDFTextLine.swift scripts/diagnose-pdf-hit.swift -o "$RUNNER_TEMP/pdf-hit-probe"
          "$RUNNER_TEMP/pdf-hit-probe"
      - name: Build universal app and package
        if: ${{ !inputs.pdf_probe }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.pdf_probe }}
        with:
          name: ReadingBook-macos-universal
          path: |
            dist/ReadingBook-macos-universal.zip
            dist/ReadingBook-macos-universal.zip.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 14
