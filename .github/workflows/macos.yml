name: Build macOS App

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/macos.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core data and plugin checks
        run: swift test --scratch-path .build/tests
      - name: Native companion layout regression
        run: python3 scripts/ui-layout-regression/run.py
      - name: Real workspace and draft regression
        run: |
          python3 scripts/native-ui-regression/build.py --bin-dir .build/tests/debug
          python3 scripts/native-ui-regression/run.py --mode workspace --cycles 24 --tag ci-workspace
          python3 scripts/native-ui-regression/run.py --mode pdf --cycles 3 --tag ci-pdf
          python3 scripts/native-ui-regression/run.py --mode samebook --cycles 3 --tag ci-samebook
          HARNESS_PDF_SCROLLER_STYLE=legacy python3 scripts/native-ui-regression/run.py --mode boundary --cycles 1 --tag ci-boundary-legacy
          HARNESS_PDF_SCROLLER_STYLE=overlay python3 scripts/native-ui-regression/run.py --mode boundary --cycles 1 --tag ci-boundary-overlay
          python3 scripts/native-ui-regression/run.py --mode map-recenter --cycles 3 --tag ci-map-recenter
          python3 scripts/native-ui-regression/run.py --mode navigation --cycles 1 --tag ci-book-picker
          python3 scripts/native-ui-regression/run.py --mode continuation --cycles 12 --tag ci-continuation
          python3 scripts/native-ui-regression/run.py --mode urgent-search-overlay --cycles 3 --tag ci-urgent-search-overlay
      - name: Native reading continuation and preservation regression
        run: |
          python3 scripts/native-ui-regression/build-reading-continuation.py --bin-dir .build/tests/debug
          .build/reading-continuation-probe/reading-continuation-probe --workspace "$PWD" --output "$PWD/logs/ci-reading-continuation"
      - name: Independent AI tasks and preservation regression
        run: |
          mkdir -p logs
          python3 scripts/native-ui-regression/build-ai-concurrency.py --bin-dir .build/tests/debug
          .build/ai-concurrency-probe/ai-concurrency-probe "$PWD" "$PWD/logs/ci-ai-concurrency"
      - name: Native folder action identity and preservation regression
        run: python3 scripts/native-ui-regression/run-folder-identity.py --bin-dir .build/tests/debug --tag ci-folder-identity
      - name: Native per-page notes and incremental find regression
        run: python3 scripts/native-ui-regression/run-page-notes.py --bin-dir .build/tests/debug --tag ci-page-notes
      - name: Native Chinese search and scoped record browser regression
        run: python3 scripts/native-ui-regression/run-ux-refinement.py --bin-dir .build/tests/debug --tag ci-ux-refinement
      - name: Native AI search intent and full-book flow regression
        run: python3 scripts/native-ui-regression/run-ai-search-flow.py --bin-dir .build/tests/debug --tag ci-ai-search-flow
      - name: Native note color, expansion and reading undo regression
        id: note_interaction
        run: python3 scripts/native-ui-regression/run-note-interaction.py --bin-dir .build/tests/debug --tag ci-note-interaction
      - name: Native component publication isolation regression
        run: |
          python3 scripts/native-ui-regression/run-component-publication.py --bin-dir .build/tests/debug --tag ci-component-publication-small --count 16
          python3 scripts/native-ui-regression/run-component-publication.py --bin-dir .build/tests/debug --tag ci-component-publication-large --count 1024
      - name: Native dynamic conversation component regression
        run: python3 scripts/native-ui-regression/run-dynamic-components.py --bin-dir .build/tests/debug --tag ci-dynamic-components
      - name: Native chat history presentation regression
        run: python3 scripts/native-ui-regression/run-chat-history.py --bin-dir .build/tests/debug --tag ci-chat-history
      - name: Native stable menu visibility regression
        run: python3 scripts/native-ui-regression/run-menu-visibility.py --bin-dir .build/tests/debug --tag ci-menu-visibility
      - name: Native graph label reuse and current actions
        run: python3 scripts/native-ui-regression/run-graph-label-reuse.py --bin-dir .build/tests/debug --tag ci-graph-label-reuse
      - name: Native map content reuse and scoped selection
        run: python3 scripts/native-ui-regression/run-map-content-reuse.py --bin-dir .build/tests/debug --tag ci-map-content-reuse
      - name: Native trajectory geometry across map content branches
        run: python3 scripts/native-ui-regression/run-map-trajectory-content.py --bin-dir .build/tests/debug --tag ci-map-trajectory-content
      - name: Rendered note mode transition regression
        run: |
          python3 scripts/native-ui-regression/run-note-mode-transitions.py --bin-dir .build/tests/debug --tag ci-mode-transitions-legacy --scroller-style legacy
          python3 scripts/native-ui-regression/run-note-mode-transitions.py --bin-dir .build/tests/debug --tag ci-mode-transitions-overlay --scroller-style overlay
      - name: Native note editor preservation and input regression
        run: |
          python3 scripts/mac-note-editor/run-native-probe.py --build-dir .build/tests/debug --output logs/ci-note-editor/native-probe.json
          python3 scripts/mac-note-editor/run-hosted-undo-probe.py --build-dir .build/tests/debug --output logs/ci-note-editor/hosted-undo.json
      - name: Native position notes and concurrent conversation summaries
        run: python3 scripts/native-ui-regression/run-experience-completion.py --bin-dir .build/tests/debug --tag ci-experience-completion
      - name: Dynamic position note fit and outer scroller regression
        run: |
          python3 scripts/native-ui-regression/run-note-layout.py --bin-dir .build/tests/debug --tag ci-note-layout-legacy --scroller-style legacy
          python3 scripts/native-ui-regression/run-note-layout.py --bin-dir .build/tests/debug --tag ci-note-layout-overlay --scroller-style overlay
      - name: Paper textures and real page curl regression
        run: python3 scripts/native-ui-regression/run-paper-reading.py --bin-dir .build/tests/debug --tag ci-paper-reading
      - name: Native Markdown bridge and preservation regression
        run: |
          node scripts/test-markdown-provenance.cjs logs/ci-markdown-bridge/provenance/result.json
          python3 scripts/mac-markdown/run-native-probe.py --workspace "$PWD" --build-dir .build/tests/debug --output-dir logs/ci-markdown-bridge/native-probe --run --show-window
          python3 scripts/mac-markdown/run-input-identity-probe.py --workspace "$PWD" --build-dir .build/tests/debug --output-dir logs/ci-markdown-bridge/input-identity --run --show-window
          python3 scripts/mac-markdown/run-history-reference-probe.py --workspace "$PWD" --build-dir .build/tests/debug --output-dir logs/ci-markdown-bridge/history-reference --run --show-window
          python3 scripts/mac-markdown/run-bounded-idle-probe.py --workspace "$PWD" --build-dir .build/tests/debug --product-source-root "$PWD" --output-dir logs/ci-markdown-bridge/bounded-idle --run --show-window
      - name: Performance evidence tool contracts
        run: |
          python3 scripts/mac-performance/test-scroll-capture-analysis.py
          python3 scripts/mac-performance/test-performance-tool-contracts.py
          python3 scripts/mac-performance/test-samebook-experiment-tools.py
          python3 scripts/mac-performance/test-scroll-pointer.py
      - name: Preserve failed Markdown native evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-markdown-native-evidence
          path: logs/ci-markdown-bridge
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed component publication evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-component-publication-evidence
          path: logs/component-publication-20261104/ci-component-publication-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed dynamic component evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-dynamic-component-evidence
          path: logs/dynamic-components-20261104/ci-dynamic-components
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed chat history evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-chat-history-evidence
          path: logs/ai-history-preparation-20261104/ci-chat-history
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed menu visibility evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-menu-visibility-evidence
          path: logs/ai-history-preparation-20261104/ci-menu-visibility
          if-no-files-found: ignore
          retention-days: 3
      - name: Diagnose failed workspace cold startup
        if: failure()
        continue-on-error: true
        run: |
          if [[ -f .build/native-ui-harness/native-ui-harness ]]; then
            HARNESS_PROFILE_STARTUP=1 python3 scripts/native-ui-regression/run.py --mode workspace --cycles 1 --tag ci-startup-profile
          fi
      - name: Preserve failed native workspace evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-native-workspace-evidence
          path: logs/native-ui-harness-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Diagnose note interaction skipped by an earlier failure
        if: failure() && steps.note_interaction.outcome == 'skipped'
        continue-on-error: true
        run: |
          if [[ -d .build/tests/debug/Modules ]]; then
            python3 scripts/native-ui-regression/run-note-interaction.py --bin-dir .build/tests/debug --tag ci-note-interaction-diagnostic
          fi
      - name: Preserve failed experience regression evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-experience-regression-evidence
          path: logs/ux-completion-20261031/ci-experience-completion
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed folder identity evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-folder-identity-evidence
          path: logs/folder-control-20261102/ci-folder-identity
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed note interaction evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-note-interaction-evidence
          path: logs/note-interaction-20261103/ci-note-interaction*
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed paper reading evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-paper-reading-evidence
          path: logs/note-paper-20261101/ci-paper-reading
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed per-page notes evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-page-notes-evidence
          path: logs/reader-page-notes-20261103/ci-page-notes
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed note mode transition evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-note-mode-transition-evidence
          path: logs/note-mode-transitions-20261103/ci-mode-transitions-*
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed Chinese search and record browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-ux-refinement-evidence
          path: logs/ux-search-performance-20261103/ci-ux-refinement
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed AI search flow evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-ai-search-flow-evidence
          path: logs/ai-search-20261103/ci-ai-search-flow
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed graph label reuse evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-graph-label-reuse-evidence
          path: logs/map-allocation-20261104/ci-graph-label-reuse
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve failed map content reuse evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-map-content-reuse-evidence
          path: |
            logs/map-rendering-20261105/ci-map-content-reuse
            logs/map-rendering-20261105/ci-map-trajectory-content
          if-no-files-found: ignore
          retention-days: 3
      - name: Build universal app and package
        if: github.event_name != 'pull_request'
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: ReadingBook-macos-universal
          path: |
            dist/ReadingBook-macos-universal.zip
            dist/ReadingBook-macos-universal.zip.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 7
