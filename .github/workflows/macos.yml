name: Build macOS App

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/macos.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core data and plugin checks
        run: swift test --scratch-path .build/tests
      - name: Native companion layout regression
        run: python3 scripts/ui-layout-regression/run.py
      - name: Real workspace and draft regression
        run: |
          python3 scripts/native-ui-regression/build.py --bin-dir .build/tests/debug
          python3 scripts/native-ui-regression/run.py --mode workspace --cycles 24 --tag ci-workspace
          python3 scripts/native-ui-regression/run.py --mode pdf --cycles 3 --tag ci-pdf
          python3 scripts/native-ui-regression/run.py --mode samebook --cycles 3 --tag ci-samebook
          python3 scripts/native-ui-regression/run.py --mode boundary --cycles 1 --tag ci-boundary
          python3 scripts/native-ui-regression/run.py --mode navigation --cycles 1 --tag ci-book-picker
          python3 scripts/native-ui-regression/run.py --mode continuation --cycles 12 --tag ci-continuation
      - name: Native reading continuation and preservation regression
        run: |
          python3 scripts/native-ui-regression/build-reading-continuation.py --bin-dir .build/tests/debug
          .build/reading-continuation-probe/reading-continuation-probe --workspace "$PWD" --output "$PWD/logs/ci-reading-continuation"
      - name: Independent AI tasks and preservation regression
        run: |
          mkdir -p logs
          python3 scripts/native-ui-regression/build-ai-concurrency.py --bin-dir .build/tests/debug
          .build/ai-concurrency-probe/ai-concurrency-probe "$PWD" "$PWD/logs/ci-ai-concurrency"
      - name: Native note editor preservation and input regression
        run: |
          python3 scripts/mac-note-editor/run-native-probe.py --build-dir .build/tests/debug --output logs/ci-note-editor/native-probe.json
          python3 scripts/mac-note-editor/run-hosted-undo-probe.py --build-dir .build/tests/debug --output logs/ci-note-editor/hosted-undo.json
      - name: Performance evidence tool contracts
        run: |
          python3 scripts/mac-performance/test-scroll-capture-analysis.py
          python3 scripts/mac-performance/test-performance-tool-contracts.py
          python3 scripts/mac-performance/test-samebook-experiment-tools.py
      - name: Build universal app and package
        if: github.event_name != 'pull_request'
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: ReadingBook-macos-universal
          path: |
            dist/ReadingBook-macos-universal.zip
            dist/ReadingBook-macos-universal.zip.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 7
