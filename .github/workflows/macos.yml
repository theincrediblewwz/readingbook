name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Inspect cold PDF round trips
        run: |
          swiftc -swift-version 5 -parse-as-library scripts/probe-native-worker-fixture.swift -o "$RUNNER_TEMP/native-fixture-probe"
          for lifetime in cold held; do
            for mode in direct-data raw-file plain crop rotation crop-rotation password combined; do
              "$RUNNER_TEMP/native-fixture-probe" "$mode" "$lifetime"
            done
          done
